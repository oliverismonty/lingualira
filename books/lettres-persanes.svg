<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" preserveAspectRatio="xMidYMid slice">
 <rect width="420" height="200" fill="#1d1d1f"/>
 <!-- Paris rooftops: houses stacked "in the air" -->
 <g fill="none" stroke="#f2f0eb" stroke-width="1.3" stroke-linejoin="round">
  <path d="M20 180 V120 H60 V96 H96 V70 H128 V108 H160 V180"/>
  <path d="M60 120 V180M96 96 V180M128 108 V180" stroke-width=".7" opacity=".5"/>
  <path d="M260 180 V110 H292 V84 H330 V104 H366 V128 H400 V180"/>
  <path d="M292 110 V180M330 104 V180M366 128 V180" stroke-width=".7" opacity=".5"/>
 </g>
 <g fill="#f2f0eb" opacity=".7">
  <rect x="30" y="132" width="6" height="9"/><rect x="44" y="132" width="6" height="9"/><rect x="70" y="106" width="6" height="9"/><rect x="104" y="80" width="6" height="9"/><rect x="138" y="118" width="6" height="9"/>
  <rect x="270" y="120" width="6" height="9"/><rect x="300" y="94" width="6" height="9"/><rect x="340" y="114" width="6" height="9"/><rect x="376" y="138" width="6" height="9"/>
 </g>
 <!-- a sealed letter in the middle -->
 <g transform="translate(210 102)">
  <path d="M-46 -30 H46 V30 H-46 Z" fill="#1d1d1f" stroke="#f2f0eb" stroke-width="1.5"/>
  <path d="M-46 -30 L0 6 L46 -30" fill="none" stroke="#f2f0eb" stroke-width="1.2"/>
  <circle cx="0" cy="6" r="7" fill="#ff6a52"/>
 </g>
 <!-- crescent moon (the "lune de Saphar") -->
 <circle cx="372" cy="40" r="12" fill="none" stroke="#f2f0eb" stroke-width="1.3"/><circle cx="377" cy="36" r="10" fill="#1d1d1f"/>
</svg>
