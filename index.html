<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinguaLira">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<title>LinguaLira</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400;1,7..72,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="mark" href="./"><svg viewBox="0 0 1024 1024" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M512 742C380 742 318 650 330 540C340 450 300 380 250 318C236 300 238 272 262 262" stroke-width="64"/><path d="M512 742C644 742 706 650 694 540C684 450 724 380 774 318C788 300 786 272 762 262" stroke-width="64"/><path d="M300 352C420 326 604 326 724 352" stroke-width="52"/><path d="M452 350L456 720M572 350L568 720" stroke-width="34"/></g><g fill="#ff6a52"><rect x="328" y="812" width="92" height="40" rx="20"/><rect x="466" y="812" width="92" height="40" rx="20"/><rect x="604" y="812" width="92" height="40" rx="20"/></g></svg>LinguaLira</a></div>
  <section class="hero"><h1>Bibliothèque</h1><p>Short classics retold in simpler French. Tap any word for its meaning.</p></section>
  <div class="shelf" id="shelf"></div>
</div>
<script>
{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
fetch('books/index.json').then(r=>r.json()).then(books=>{
  document.getElementById('shelf').innerHTML=books.map(b=>{
    const done=Object.keys(get(b.slug+'-done',{})).length,pct=Math.round(done/b.chapters*100);
    const mins=Math.round(b.words/55/5)*5;
    return `<a class="book" href="reader.html?b=${encodeURIComponent(b.slug)}">
      <div class="cv"><img src="books/${encodeURIComponent(b.slug)}.svg" alt=""></div>
      <div><h3>${esc(b.title)}</h3><p class="au">${esc(b.author)}, ${esc(b.year)}</p>
      <p class="bl">${esc(b.blurb)}</p>
      <div class="tags small"><span>${esc(b.level)}</span><span>${b.chapters} chapitres</span><span>~${mins} min</span>${done?`<span>${done===b.chapters?'✓ Lu':pct+'% lu'}</span>`:''}</div>
      ${done?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div></a>`;
  }).join('');
}).catch(()=>{document.getElementById('shelf').innerHTML='<p class="err">The book list could not be loaded. Check your connection and try again.</p>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
