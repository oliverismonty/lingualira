<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinguaLira">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<title>Lecture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400;1,7..72,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="./">← Bibliothèque</a><span class="sp"></span><a class="mark" href="./" aria-label="LinguaLira"><svg viewBox="0 0 1024 1024" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M512 742C380 742 318 650 330 540C340 450 300 380 250 318C236 300 238 272 262 262" stroke-width="64"/><path d="M512 742C644 742 706 650 694 540C684 450 724 380 774 318C788 300 786 272 762 262" stroke-width="64"/><path d="M300 352C420 326 604 326 724 352" stroke-width="52"/><path d="M452 350L456 720M572 350L568 720" stroke-width="34"/></g><g fill="#ff6a52"><rect x="328" y="812" width="92" height="40" rx="20"/><rect x="466" y="812" width="92" height="40" rx="20"/><rect x="604" y="812" width="92" height="40" rx="20"/></g></svg></a></div>
  <div class="cover"><img id="cover" alt=""></div>
  <section class="bookhead">
    <h1 id="title"></h1>
    <p class="au" id="author"></p>
    <p class="bl" id="blurb"></p>
    <p class="small" id="meta"></p>
    <button class="go" id="start">Commencer la lecture</button>
  </section>
<main id="main"></main>
</div>
<section class="reader" id="reader" aria-label="Lecteur" hidden>
  <div class="rtop"><button class="ic" data-close aria-label="Fermer">×</button><span class="rch" id="rch"></span><button class="aa" id="aa" aria-label="Réglages" aria-expanded="false">Aa</button><button class="pill" id="mots">Mes mots · 0</button></div>
  <div class="menu" id="menu" hidden>
    <div class="mrow"><span>Taille du texte</span><span class="seg"><button data-fs="-1" aria-label="Plus petit">A−</button><button data-fs="1" aria-label="Plus grand">A+</button></span></div>
    <div class="mrow" id="ttsrow"><span>Prononcer les mots</span><button class="sw" id="auto" role="switch" aria-checked="true" aria-label="Prononcer les mots"><i></i></button></div>
  </div>
  <div class="page" id="page"></div>
  <div class="page measure" id="measure" aria-hidden="true"></div>
  <div class="rbot"><button class="nav" data-prev aria-label="Page précédente">←</button><span class="cnt" id="cnt"></span><button class="nav" data-next aria-label="Page suivante">→</button></div>
</section>
<div class="sheet" id="sheet" role="dialog" aria-label="Traduction"><div class="card" id="card"></div></div>
<script>
{
// app feel: block pinch and double-tap zoom (iOS ignores user-scalable on its own)
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<300&&!e.target.closest('.w,button,a'))e.preventDefault();lastTouch=n},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.reader,.sheet,img,a'))e.preventDefault()});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('b')||'';
const store={get(k,d){try{const v=localStorage.getItem(slug+'-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(slug+'-'+k,JSON.stringify(v))}catch(e){}}};
const roman=n=>{let r='',v=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];for(const[a,s]of v)while(n>=a){r+=s;n-=a}return r};
let B,BOOK,DICT,PHR,PAGES=[],saved=store.get('saved',{}),done=store.get('done',{}),pg=0,sel=null;

const sw=s=>s[0].filter(Array.isArray).length;
const wc=ch=>ch.p.flat().reduce((n,s)=>n+sw(s),0);
const mins=n=>Math.max(3,Math.round(n/55));

// Pages are measured on the real screen: as much text as fits, never a scrollbar.
const add=(P,pi,si)=>{let l=P.items[P.items.length-1];if(!l||l[0]!==pi){l=[pi,[]];P.items.push(l)}l[1].push(si)};
const pop=P=>{const l=P.items[P.items.length-1];l[1].pop();if(!l[1].length)P.items.pop()};
const nS=P=>P.items.reduce((n,x)=>n+x[1].length,0);
function pageHTML(P,last){const ch=BOOK[P.c];
  return (P.first?`<p class="kick">Chapitre ${P.c+1}</p><h2>${esc(ch.fr)}</h2><p class="en">${esc(ch.en)}</p>`:'')+
    P.items.map(([pi,ss])=>'<p class="t">'+ss.map(si=>`<span class="s" data-s="${pi}-${si}">`+ch.p[pi][si][0].map(word).join('')+'</span>').join(' ')+'</p>').join('')+
    (last?`<p class="fin">Fin. Bravo, you have read ${esc(B.title)}!</p>`:'');}
function paginate(){
  const R=$('#reader'),cs=getComputedStyle(R),m=$('#measure');
  const avail=R.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-R.querySelector('.rtop').offsetHeight-R.querySelector('.rbot').offsetHeight-2;
  const fits=(P,last)=>{m.innerHTML=pageHTML(P,last);return m.offsetHeight<=avail};
  PAGES=[];
  BOOK.forEach((ch,c)=>{let cur=null;
    ch.p.forEach((p,pi)=>p.forEach((s,si)=>{
      if(!cur){cur={c,first:true,items:[]};PAGES.push(cur)}
      add(cur,pi,si);
      if(nS(cur)>1&&!fits(cur,false)){pop(cur);cur={c,first:false,items:[]};PAGES.push(cur);add(cur,pi,si)}
    }))});
  const L=PAGES[PAGES.length-1];
  if(nS(L)>1&&!fits(L,true)){const k=L.items[L.items.length-1],si=k[1][k[1].length-1];pop(L);const N={c:L.c,first:false,items:[]};add(N,k[0],si);PAGES.push(N)}
  m.innerHTML='';
}
const keyOf=P=>[P.c,P.items[0][0],P.items[0][1][0]];
function find(k){if(!k)return 0;const i=PAGES.findIndex(P=>P.c===k[0]&&P.items.some(([pi,ss])=>pi===k[1]&&ss.includes(k[2])));return i<0?0:i}
const chStart=c=>find([c,0,0]);

function home(){
  const k=store.get('pos',null);
  $('#start').textContent=k&&(k[0]||k[1]||k[2])?'Continuer la lecture':'Commencer la lecture';
  $('#main').innerHTML=`<div class="homebar"><h2>Chapitres</h2><button class="pill" data-list>Mes mots · ${Object.keys(saved).length}</button></div><ul class="toc">`+
   BOOK.map((ch,i)=>`<li><button data-c="${i}"><span class="n">${roman(i+1)}</span><span><span class="f">${esc(ch.fr)}</span><span class="e">${esc(ch.en)}</span></span><span class="m ${done[i]?'ok':''}">${done[i]?'✓ lu':mins(wc(ch))+' min'}</span></button></li>`).join('')+'</ul>'+
   '<p class="hint">Tap any word to translate it. Swipe or use the arrows to turn pages. Tapping a word also says it aloud. Aa has text size and sound settings.</p>';
}
function word(x){if(!Array.isArray(x))return esc(x);const w=x[0],lw=w.toLowerCase();return `<span class="w${saved[lw]?' sv':''}" tabindex="0" data-w="${esc(lw)}">${esc(w)}</span>`}
function page(){
  const P=PAGES[pg],ch=BOOK[P.c];
  $('#rch').textContent=`${roman(P.c+1)} · ${ch.fr}`;
  $('#page').innerHTML=pageHTML(P,pg===PAGES.length-1);
  $('#cnt').textContent=`${pg+1} of ${PAGES.length}`;
  $('[data-prev]').disabled=pg===0;$('[data-next]').disabled=pg===PAGES.length-1;
  $('#page').scrollTop=0;
  const nx=PAGES[pg+1];if((!nx||nx.c!==P.c)&&!done[P.c]){done[P.c]=1;store.set('done',done)}
  store.set('pos',keyOf(P));
}
function reflow(){if($('#reader').hidden)return;close();const k=keyOf(PAGES[pg]);paginate();pg=find(k);page()}
let rT=0;addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(reflow,150)});
// Text to speech with the phone's own French voices
const TTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
const SPK='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));if(!vs.length)return;
  const sc=v=>(/fr[-_]FR/i.test(v.lang)?4:0)+(/premium/i.test(v.name)?3:/enhanced|amélioré/i.test(v.name)?2:0)+(v.localService?1:0);
  voice=vs.sort((a,b)=>sc(b)-sc(a))[0]}catch(e){}}
if(TTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
function say(text,rate){if(!TTS||!text)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice?voice.lang:'fr-FR';if(voice)u.voice=voice;u.rate=rate||1;speechSynthesis.speak(u)}catch(e){}}
function hush(){if(TTS)try{speechSynthesis.cancel()}catch(e){}}
let autoSay=(()=>{try{return localStorage.getItem('ll-say')!=='0'}catch(e){return true}})();
function setAuto(v){autoSay=v;$('#auto').setAttribute('aria-checked',v?'true':'false');try{localStorage.setItem('ll-say',v?'1':'0')}catch(e){}}
// say an elided word with the word it joins: l' + homme
function wordText(wEl){let t=wEl.textContent;if(/'$/.test(t)){let n=wEl.nextSibling;while(n&&!(n.classList&&n.classList.contains('w')))n=n.nextSibling;if(n)t+=n.textContent}return t}
const plain=seg=>seg.map(x=>Array.isArray(x)?x[0]:x).join('').replace(/[«»]/g,'').trim();
function menu(open){const m=$('#menu');m.hidden=!open;$('#aa').setAttribute('aria-expanded',open?'true':'false')}
const SIZES=[.86,1,1.14,1.3];
let fsI=(()=>{try{const v=+localStorage.getItem('ll-size');return SIZES[v]?v:1}catch(e){return 1}})();
function applySize(){document.documentElement.style.setProperty('--fs',SIZES[fsI])}
let lock=null;
async function wake(on){try{if(on&&'wakeLock'in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}else if(!on&&lock){await lock.release();lock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#reader').hidden)wake(true)});
async function read(k){
  $('#reader').hidden=false;document.body.style.overflow='hidden';wake(true);
  try{await document.fonts.ready}catch(e){}
  paginate();pg=find(k);page();
}
function unread(){menu(false);close();wake(false);$('#reader').hidden=true;document.body.style.overflow='';home()}
function turn(d){const n=pg+d;if(n<0||n>=PAGES.length)return;close();pg=n;page()}
function phrasesFor(sentEl,wEl){
  const ws=[...sentEl.querySelectorAll('.w')],i=ws.indexOf(wEl),t=ws.map(w=>w.dataset.w),hits=[];
  for(const [p,g] of PHR){const n=p.length;
    for(let s=Math.max(0,i-n+1);s<=i&&s+n<=t.length;s++){
      let ok=true;for(let j=0;j<n;j++)if(t[s+j]!==p[j]){ok=false;break}
      if(ok){hits.push([p,g,n]);break}}}
  return hits.sort((a,b)=>b[2]-a[2]).slice(0,2);
}
const fmtP=p=>p.join(' ').replace(/' /g,"'");
function open(wEl){
  document.querySelectorAll('.w.on,.s.on').forEach(e=>e.classList.remove('on'));
  const sEl=wEl.closest('.s');wEl.classList.add('on');sEl.classList.add('on');
  const [pi,si]=sEl.dataset.s.split('-').map(Number);
  const S=BOOK[PAGES[pg].c].p[pi][si];
  sel={w:wEl.dataset.w,shown:wEl.textContent,say:wordText(wEl),fr:plain(S[0]),en:S[1],ph:phrasesFor(sEl,wEl),showTr:false};
  draw();$('#sheet').classList.add('open');
  if(autoSay)say(sel.say,.85);
  requestAnimationFrame(()=>{const pe=$('#page');pe.style.transform='';const r=wEl.getBoundingClientRect(),lim=innerHeight-$('#card').offsetHeight-16;if(r.bottom>lim)pe.style.transform=`translateY(${Math.round(lim-r.bottom-12)}px)`});
}
function draw(){
  if(!sel)return;
  const d=DICT[sel.w]||['',''],isS=!!saved[sel.w];
  $('#card').innerHTML=`<div class="row">${TTS?`<button class="wd wdb" data-say-w aria-label="Écouter le mot">${esc(sel.shown)}<span class="spk">${SPK}</span></button>`:`<div class="wd">${esc(sel.shown)}</div>`}<button class="x" data-x aria-label="Fermer">×</button></div>
   <p class="gl">${esc(d[0])}</p>${d[1]?`<p class="nt">${esc(d[1])}</p>`:''}
   ${sel.ph.map(([p,g])=>`<p class="ph"><b>${esc(fmtP(p))}</b> = ${esc(g)}</p>`).join('')}
   ${sel.showTr?`<p class="tr">${esc(sel.en)}</p>`:''}
   <div class="acts">${TTS?`<button class="say" data-say-s>${SPK}Écouter</button>`:''}<button data-tr>${sel.showTr?'Hide English':'English'}</button><button class="star ${isS?'on':''}" data-star>${isS?'★ Saved':'☆ Save'}</button></div>`;
}
function close(){hush();$('#sheet').classList.remove('open');const pe=$('#page');if(pe)pe.style.transform='';document.querySelectorAll('.w.on,.s.on').forEach(e=>e.classList.remove('on'));sel=null}
function count(){$('#mots').textContent='Mes mots · '+Object.keys(saved).length}
function mark(){document.querySelectorAll('.w').forEach(e=>e.classList.toggle('sv',!!saved[e.dataset.w]))}
function showList(){
  close();const ks=Object.keys(saved);
  $('#card').innerHTML=`<div class="row"><div class="wd">Mes mots</div><button class="x" data-x aria-label="Fermer">×</button></div>`+
   (ks.length?`<ul class="list">${ks.map(k=>`<li><div><b${TTS?` class="sayw" data-say="${esc(saved[k])}"`:''}>${esc(saved[k])}</b><span>${esc((DICT[k]||[''])[0])}</span></div><button class="x" data-rm="${esc(k)}" aria-label="Retirer">−</button></li>`).join('')}</ul>`:'<p class="empty">No saved words yet. Tap a word in the text, then press Save. Tap a saved word to hear it.</p>');
  $('#sheet').classList.add('open');
}
function bind(){
  document.addEventListener('click',e=>{
    const t=e.target;
    const w=t.closest('.w');if(w){open(w);return}
    if(t.closest('#start')){read(store.get('pos',null));return}
    const c=t.closest('[data-c]');if(c){read([+c.dataset.c,0,0]);return}
    if(t.closest('#aa')){menu($('#menu').hidden);return}
    const fs=t.closest('[data-fs]');if(fs){const n=Math.max(0,Math.min(SIZES.length-1,fsI+ +fs.dataset.fs));if(n!==fsI){fsI=n;applySize();try{localStorage.setItem('ll-size',fsI)}catch(e){}reflow()}return}
    if(t.closest('#auto')){setAuto(!autoSay);return}
    if(t.closest('#menu'))return;
    if(!$('#menu').hidden){menu(false);return}
    if(t.closest('[data-say-s]')){say(sel.fr,.92);return}
    if(t.closest('[data-say-w]')){say(sel.say,.85);return}
    const sy=t.closest('[data-say]');if(sy){say(sy.dataset.say,.85);return}
    if(t.closest('[data-prev]')){turn(-1);return}
    if(t.closest('[data-next]')){turn(1);return}
    if(t.closest('[data-close]')){unread();return}
    if(t.closest('[data-x]')){close();return}
    if(t.closest('[data-tr]')){sel.showTr=!sel.showTr;draw();return}
    if(t.closest('[data-star]')){if(saved[sel.w])delete saved[sel.w];else saved[sel.w]=sel.shown.toLowerCase();store.set('saved',saved);count();mark();draw();return}
    const rm=t.closest('[data-rm]');if(rm){delete saved[rm.dataset.rm];store.set('saved',saved);count();mark();showList();if($('#reader').hidden)home();return}
    if(t.closest('#mots')||t.closest('[data-list]')){showList();return}
    if(!t.closest('#sheet'))close();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if($('#sheet').classList.contains('open'))close();else if(!$('#reader').hidden)unread()}
    if(!$('#reader').hidden&&e.key==='ArrowRight')turn(1);
    if(!$('#reader').hidden&&e.key==='ArrowLeft')turn(-1);
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('w')){e.preventDefault();open(e.target)}
  });
  let tx=0,ty=0;
  $('#page').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  $('#page').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dy)<50)turn(dx<0?1:-1)},{passive:true});
}
fetch('books/'+encodeURIComponent(slug)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{
  B=data;BOOK=data.book;DICT=data.dict;PHR=data.phrases;
  document.title=B.title;
  $('#title').textContent=B.title;$('#blurb').textContent=B.blurb;
  $('#author').textContent=`${B.author}, ${B.year}`;
  $('#meta').textContent=`${B.level} · ${B.chapters} chapitres · ${B.words.toLocaleString('en-GB')} mots · ~${Math.round(B.words/55/5)*5} min`;
  $('#cover').src='books/'+encodeURIComponent(slug)+'.svg';
  bind();applySize();setAuto(autoSay);if(!TTS)$('#ttsrow').hidden=true;count();home();
}).catch(()=>{$('#main').innerHTML='<p class="err">This book could not be found. <a href="./">Back to the library</a></p>';$('#start').hidden=true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
