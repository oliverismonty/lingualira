<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinguaLira">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<title>Lecture</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400;1,7..72,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="./">← Bibliothèque</a><span class="sp"></span><a class="mark" href="./" aria-label="LinguaLira"><svg viewBox="0 0 1024 1024" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M512 742C380 742 318 650 330 540C340 450 300 380 250 318C236 300 238 272 262 262" stroke-width="64"/><path d="M512 742C644 742 706 650 694 540C684 450 724 380 774 318C788 300 786 272 762 262" stroke-width="64"/><path d="M300 352C420 326 604 326 724 352" stroke-width="52"/><path d="M452 350L456 720M572 350L568 720" stroke-width="34"/></g><g fill="#ff6a52"><rect x="328" y="812" width="92" height="40" rx="20"/><rect x="466" y="812" width="92" height="40" rx="20"/><rect x="604" y="812" width="92" height="40" rx="20"/></g></svg></a></div>
  <div class="cover"><img id="cover" alt=""></div>
  <section class="bookhead">
    <h1 id="title"></h1>
    <p class="au" id="author"></p>
    <p class="bl" id="blurb"></p>
    <p class="small" id="meta"></p>
    <button class="go" id="start">Commencer la lecture</button>
  </section>
<main id="main"></main>
</div>
<section class="reader" id="reader" aria-label="Lecteur" hidden>
  <div class="rtop"><button class="ic" data-close aria-label="Fermer">×</button><span class="rch" id="rch"></span><button class="pill" id="mots">Mes mots · 0</button></div>
  <div class="page" id="page"></div>
  <div class="rbot"><button class="nav" data-prev aria-label="Page précédente">←</button><span class="cnt" id="cnt"></span><button class="nav" data-next aria-label="Page suivante">→</button></div>
</section>
<div class="sheet" id="sheet" role="dialog" aria-label="Traduction"><div class="card" id="card"></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=new URLSearchParams(location.search).get('b')||'';
const store={get(k,d){try{const v=localStorage.getItem(slug+'-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(slug+'-'+k,JSON.stringify(v))}catch(e){}}};
const roman=n=>{let r='',v=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];for(const[a,s]of v)while(n>=a){r+=s;n-=a}return r};
let B,BOOK,DICT,PHR,PAGES=[],saved=store.get('saved',{}),done=store.get('done',{}),pg=0,sel=null;

const sw=s=>s[0].filter(Array.isArray).length;
const wc=ch=>ch.p.flat().reduce((n,s)=>n+sw(s),0);
const mins=n=>Math.max(3,Math.round(n/55));

function paginate(){ // ~70 words a page, never splitting a sentence
  BOOK.forEach((ch,c)=>{let cur=null,n=0;
    ch.p.forEach((p,pi)=>p.forEach((s,si)=>{const k=sw(s);
      if(!cur||(n+k>(cur.first?52:72)&&n>0)){cur={c,first:!PAGES.some(x=>x.c===c),items:[]};PAGES.push(cur);n=0}
      let last=cur.items[cur.items.length-1];if(!last||last[0]!==pi){last=[pi,[]];cur.items.push(last)}
      last[1].push(si);n+=k}))});
}
const chStart=c=>PAGES.findIndex(p=>p.c===c);

function home(){
  $('#start').textContent=store.get('pg',0)>0?'Continuer la lecture':'Commencer la lecture';
  $('#main').innerHTML=`<div class="homebar"><h2>Chapitres</h2><button class="pill" data-list>Mes mots · ${Object.keys(saved).length}</button></div><ul class="toc">`+
   BOOK.map((ch,i)=>`<li><button data-c="${i}"><span class="n">${roman(i+1)}</span><span><span class="f">${esc(ch.fr)}</span><span class="e">${esc(ch.en)}</span></span><span class="m ${done[i]?'ok':''}">${done[i]?'✓ lu':mins(wc(ch))+' min'}</span></button></li>`).join('')+'</ul>'+
   '<p class="hint">Tap any word to translate it. Swipe or use the arrows to turn pages.</p>';
}
function word(x){if(!Array.isArray(x))return esc(x);const w=x[0],lw=w.toLowerCase();return `<span class="w${saved[lw]?' sv':''}" tabindex="0" data-w="${esc(lw)}">${esc(w)}</span>`}
function page(){
  const P=PAGES[pg],ch=BOOK[P.c];
  $('#rch').textContent=`${roman(P.c+1)} · ${ch.fr}`;
  $('#page').innerHTML=(P.first?`<p class="kick">Chapitre ${P.c+1}</p><h2>${esc(ch.fr)}</h2><p class="en">${esc(ch.en)}</p>`:'')+
    P.items.map(([pi,ss])=>'<p class="t">'+ss.map(si=>`<span class="s" data-s="${pi}-${si}">`+ch.p[pi][si][0].map(word).join('')+'</span>').join(' ')+'</p>').join('')+
    (pg===PAGES.length-1?`<p class="fin">Fin. Bravo, you have read ${esc(B.title)}!</p>`:'');
  $('#cnt').textContent=`${pg+1} of ${PAGES.length}`;
  $('[data-prev]').disabled=pg===0;$('[data-next]').disabled=pg===PAGES.length-1;
  $('#page').scrollTop=0;
  const nx=PAGES[pg+1];if((!nx||nx.c!==P.c)&&!done[P.c]){done[P.c]=1;store.set('done',done)}
  store.set('pg',pg);
}
function read(at){
  pg=Math.max(0,Math.min(PAGES.length-1,at));
  $('#reader').hidden=false;document.body.style.overflow='hidden';page();
}
function unread(){close();$('#reader').hidden=true;document.body.style.overflow='';home()}
function turn(d){const n=pg+d;if(n<0||n>=PAGES.length)return;close();pg=n;page()}
function phrasesFor(sentEl,wEl){
  const ws=[...sentEl.querySelectorAll('.w')],i=ws.indexOf(wEl),t=ws.map(w=>w.dataset.w),hits=[];
  for(const [p,g] of PHR){const n=p.length;
    for(let s=Math.max(0,i-n+1);s<=i&&s+n<=t.length;s++){
      let ok=true;for(let j=0;j<n;j++)if(t[s+j]!==p[j]){ok=false;break}
      if(ok){hits.push([p,g,n]);break}}}
  return hits.sort((a,b)=>b[2]-a[2]).slice(0,2);
}
const fmtP=p=>p.join(' ').replace(/' /g,"'");
function open(wEl){
  document.querySelectorAll('.w.on,.s.on').forEach(e=>e.classList.remove('on'));
  const sEl=wEl.closest('.s');wEl.classList.add('on');sEl.classList.add('on');
  const [pi,si]=sEl.dataset.s.split('-').map(Number);
  sel={w:wEl.dataset.w,shown:wEl.textContent,en:BOOK[PAGES[pg].c].p[pi][si][1],ph:phrasesFor(sEl,wEl),showTr:false};
  draw();$('#sheet').classList.add('open');
  requestAnimationFrame(()=>{const r=wEl.getBoundingClientRect(),lim=innerHeight-$('#card').offsetHeight-16;if(r.bottom>lim)$('#page').scrollBy({top:r.bottom-lim+24,behavior:'smooth'})});
}
function draw(){
  if(!sel)return;
  const d=DICT[sel.w]||['',''],isS=!!saved[sel.w];
  $('#card').innerHTML=`<div class="row"><div class="wd">${esc(sel.shown)}</div><button class="x" data-x aria-label="Fermer">×</button></div>
   <p class="gl">${esc(d[0])}</p>${d[1]?`<p class="nt">${esc(d[1])}</p>`:''}
   ${sel.ph.map(([p,g])=>`<p class="ph"><b>${esc(fmtP(p))}</b> = ${esc(g)}</p>`).join('')}
   ${sel.showTr?`<p class="tr">${esc(sel.en)}</p>`:''}
   <div class="acts"><button data-tr>${sel.showTr?'Hide sentence':'Translate sentence'}</button><button class="star ${isS?'on':''}" data-star>${isS?'★ Saved':'☆ Save word'}</button></div>`;
}
function close(){$('#sheet').classList.remove('open');document.querySelectorAll('.w.on,.s.on').forEach(e=>e.classList.remove('on'));sel=null}
function count(){$('#mots').textContent='Mes mots · '+Object.keys(saved).length}
function mark(){document.querySelectorAll('.w').forEach(e=>e.classList.toggle('sv',!!saved[e.dataset.w]))}
function showList(){
  close();const ks=Object.keys(saved);
  $('#card').innerHTML=`<div class="row"><div class="wd">Mes mots</div><button class="x" data-x aria-label="Fermer">×</button></div>`+
   (ks.length?`<ul class="list">${ks.map(k=>`<li><div><b>${esc(saved[k])}</b><span>${esc((DICT[k]||[''])[0])}</span></div><button class="x" data-rm="${esc(k)}" aria-label="Retirer">−</button></li>`).join('')}</ul>`:'<p class="empty">No saved words yet. Tap a word in the text, then press Save word.</p>');
  $('#sheet').classList.add('open');
}
function bind(){
  document.addEventListener('click',e=>{
    const t=e.target;
    const w=t.closest('.w');if(w){open(w);return}
    if(t.closest('#start')){read(store.get('pg',0)|0);return}
    const c=t.closest('[data-c]');if(c){read(chStart(+c.dataset.c));return}
    if(t.closest('[data-prev]')){turn(-1);return}
    if(t.closest('[data-next]')){turn(1);return}
    if(t.closest('[data-close]')){unread();return}
    if(t.closest('[data-x]')){close();return}
    if(t.closest('[data-tr]')){sel.showTr=!sel.showTr;draw();return}
    if(t.closest('[data-star]')){if(saved[sel.w])delete saved[sel.w];else saved[sel.w]=sel.shown.toLowerCase();store.set('saved',saved);count();mark();draw();return}
    const rm=t.closest('[data-rm]');if(rm){delete saved[rm.dataset.rm];store.set('saved',saved);count();mark();showList();if($('#reader').hidden)home();return}
    if(t.closest('#mots')||t.closest('[data-list]')){showList();return}
    if(!t.closest('#sheet'))close();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if($('#sheet').classList.contains('open'))close();else if(!$('#reader').hidden)unread()}
    if(!$('#reader').hidden&&e.key==='ArrowRight')turn(1);
    if(!$('#reader').hidden&&e.key==='ArrowLeft')turn(-1);
    if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('w')){e.preventDefault();open(e.target)}
  });
  let tx=0,ty=0;
  $('#page').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  $('#page').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dy)<50)turn(dx<0?1:-1)},{passive:true});
}
fetch('books/'+encodeURIComponent(slug)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{
  B=data;BOOK=data.book;DICT=data.dict;PHR=data.phrases;
  document.title=B.title;
  $('#title').textContent=B.title;$('#blurb').textContent=B.blurb;
  $('#author').textContent=`${B.author}, ${B.year}`;
  $('#meta').textContent=`${B.level} · ${B.chapters} chapitres · ${B.words.toLocaleString('en-GB')} mots · ~${Math.round(B.words/55/5)*5} min`;
  $('#cover').src='books/'+encodeURIComponent(slug)+'.svg';
  paginate();bind();count();home();
}).catch(()=>{$('#main').innerHTML='<p class="err">This book could not be found. <a href="./">Back to the library</a></p>';$('#start').hidden=true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
