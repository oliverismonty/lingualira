<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
<title>Voice taster · LinguaLira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,800;1,7..72,400;1,7..72,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tl{list-style:none;padding:0;margin:0 0 80px}
.tl li{border-top:1px solid var(--line);padding:16px 0}
.tl .fr{font-size:19px;line-height:1.5;margin:0 0 10px}
.tl .word .fr{font-size:24px;font-weight:600}
.plays{display:flex;gap:8px;flex-wrap:wrap}
.plays button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:12px;min-height:46px;padding:0 14px;font:15px system-ui,-apple-system,sans-serif;color:var(--ink)}
.plays button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.plays button:disabled{opacity:.35}
.plays svg{width:16px;height:16px}
.err{background:var(--soft);border-radius:12px;padding:12px 16px;font:14px system-ui,-apple-system,sans-serif;color:var(--mute);overflow-wrap:anywhere}
h2{font-size:22px;font-style:italic;font-weight:800;margin:28px 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="./">← Bibliothèque</a></div>
  <section class="hero"><h1>Voice taster</h1><p id="sub">Loading the samples…</p></section>
  <div id="out"></div>
</div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>';
const short=m=>m.replace(/^gemini-/,'').replace(/-flash-tts(-preview)?$/,' Flash').replace(/-/g,' ');
let audio=null,onBtn=null;
fetch('audio/taster/index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  $('#sub').textContent=`Voice ${d.voice}. Tap the buttons to compare each model saying the same thing. Made ${d.made}.`;
  const row=it=>`<li class="${it.kind}"><p class="fr">${esc(it.text)}</p><div class="plays">${d.models.map(m=>`<button data-src="${esc(it.files[m]||'')}"${it.files[m]?'':' disabled'}>${PLAY}${esc(short(m))}</button>`).join('')}</div></li>`;
  const errs=Object.entries(d.errors||{}).map(([m,e])=>`<p class="err"><b>${esc(short(m))}</b> had an error: ${esc(e)}</p>`).join('');
  $('#out').innerHTML=errs+'<h2>Sentences</h2><ul class="tl">'+d.items.filter(i=>i.kind==='sentence').map(row).join('')+'</ul><h2>Single words</h2><ul class="tl">'+d.items.filter(i=>i.kind==='word').map(row).join('')+'</ul>';
}).catch(()=>{$('#sub').textContent='No samples yet. Run the "Voice taster" job on GitHub (Actions tab), wait two or three minutes, then reload this page.'});
document.addEventListener('click',e=>{const b=e.target.closest('[data-src]');if(!b||!b.dataset.src)return;
  if(audio){audio.pause();onBtn&&onBtn.classList.remove('on')}
  if(onBtn===b){onBtn=null;return}
  audio=new Audio(b.dataset.src);onBtn=b;b.classList.add('on');audio.onended=()=>{b.classList.remove('on');onBtn=null};audio.play().catch(()=>{b.classList.remove('on')});
});
}
</script>
</body>
</html>
