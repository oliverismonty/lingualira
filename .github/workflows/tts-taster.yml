name: Voice taster

# Makes a few sample sentences and words with each Gemini TTS model and
# publishes them to taster.html. Needs the repository secret GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: Gemini voice name
        default: Iapetus
      models:
        description: Models to compare (comma separated)
        default: gemini-3.8-flash-tts
      sentences:
        description: How many sample sentences
        default: "2"
      words:
        description: How many sample words
        default: "2"

permissions:
  contents: write

jobs:
  taster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate samples
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_VOICE: ${{ inputs.voice }}
          TTS_MODELS: ${{ inputs.models }}
          TTS_SENTENCES: ${{ inputs.sentences }}
          TTS_WORDS: ${{ inputs.words }}
        run: python3 tools/tts.py taster
      - name: Publish samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/taster
          git commit -m "Voice taster: ${{ inputs.voice }}" || echo "nothing to commit"
          git push
